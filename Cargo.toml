[package]
name = "lmstudio-models"
version = "0.1.0"
edition = "2021"
description = "LM Studio model registry resolver"

[[bin]]
name = "lmstudio-models"
path = "src/main.rs"

[[bin]]
name = "lmstudio-snippets"
path = "src/bin/lmstudio-snippets.rs"

[dependencies]
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"
